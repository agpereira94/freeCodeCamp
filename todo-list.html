<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="list-container">
        <h1>To-Do List</h1>
        <ul class="todo-list">
            <li class="item">
                <input id="github" type="checkbox"><label for="github">Set up GitHub repository</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://github.com/" target="_blank">GitHub</a></li>
                </ul>
            </li>
            <li class="item">
                <input id="techstack" type="checkbox"><label for="techstack">Choose Tech Stack</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://stackshare.io/" target="_blank">StackShare</a></li>
                </ul>
            </li>
            <li class="item">
                <input id="wireframes" type="checkbox"><label for="wireframes">Design Wireframes</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.figma.com/?utm_source=google&utm_medium=cpc&utm_campaign=22372327907&utm_term=figma&utm_content=741484196807&utm_adgroup=176618745563&gad_source=1&gclid=CjwKCAjw--K_BhB5EiwAuwYoyoq0_NgpTHZ-D2dpve1tezgmnDuQq0T3YeFOv8MBAzVEXkvEL_wXeRoC1eQQAvD_BwE" target="_blank">Figma</a></li>
                </ul>
            </li>
            <li class="item">
                <input id="first-version" type="checkbox"><label for="first-version">Deploy First Version</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://vercel.com/" target="_blank">Vercel</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
